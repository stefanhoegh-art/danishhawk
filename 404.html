<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Siden findes ikke — Danish Hawk</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
       background:#f5f2ed;color:#0f0e0b;font-family:"DM Mono",monospace;font-weight:300}
  .card{max-width:520px;text-align:center}
  .mark{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#c8a96e;margin-bottom:26px}
  h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:300;font-size:clamp(34px,7vw,46px);
     line-height:1.1;margin:0 0 16px}
  p{font-size:13px;line-height:1.85;color:#4a4643;margin:0 0 8px}
  a{display:inline-block;margin-top:26px;color:#0f0e0b;text-decoration:none;font-size:11px;
    letter-spacing:.16em;text-transform:uppercase;border-bottom:1px solid #c8a96e;padding-bottom:3px}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">Danish Hawk</div>
    <h1>Siden findes ikke.</h1>
    <p>Vi kan ikke finde den side, du leder efter.</p>
    <p>We can’t find the page you’re looking for.</p>
    <a href="/">Tilbage til forsiden — Back to the front page</a>
  </div>
</body>
</html>
