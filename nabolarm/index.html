<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Nabolarm</title>
<!-- GitHub Pages serves paths case-sensitively, so /nabolarm and /NaboLarm are
     two different addresses. The app lives at the capitalised one; this sends
     the lowercase spelling there, because that is how the address gets typed. -->
<meta http-equiv="refresh" content="0; url=/NaboLarm/"/>
<link rel="canonical" href="https://danishhawk.com/NaboLarm/"/>
<meta name="robots" content="noindex"/>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0E1526; color:#E8E5DC; font:400 15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  a { color:#F0A73C; }
</style>
</head>
<body>
  <p>Videre til <a href="/NaboLarm/">Nabolarm</a>&nbsp;…</p>
  <script>location.replace('/NaboLarm/');</script>
</body>
</html>
